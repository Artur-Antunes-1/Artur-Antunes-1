name: Update contribution landscape

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/generate-contributions.py"
      - ".github/workflows/profile-activity.yml"

concurrency:
  group: profile-contribution-landscape
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate the light and dark landscapes
        run: python3 scripts/generate-contributions.py "$PROFILE_OWNER"
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
      - name: Save updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-dark.svg assets/contributions-light.svg README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update contribution landscape [skip ci]"
          git push
